[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "allfab-video-library-api"
version = "0.1.0"
description = "Backend API for the All Fab offline video library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1.0",
  "boto3>=1.35,<2.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.16,<3.0",
  "pip-audit>=2.9,<3.0",
  "pip-tools>=7.5,<8.0",
  "pyright>=1.1.400,<2.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=allfab_api --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."

[tool.setuptools.packages.find]
where = ["src"]
