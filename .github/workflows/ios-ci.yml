name: iOS CI

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unsigned iPad simulator build and tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.48.0
      XCODEGEN_SHA256: 620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Report Apple toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          destination="$RUNNER_TEMP/xcodegen"
          url="https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"

          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum --algorithm 256 --check
          mkdir -p "$destination"
          ditto -x -k "$archive" "$destination"

          binary="$(find "$destination" -type f -name xcodegen | sed -n '1p')"
          test -n "$binary"
          chmod +x "$binary"
          "$binary" --version
          echo "XCODEGEN_BIN=$binary" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -euo pipefail
          "$XCODEGEN_BIN" generate --spec project.yml
          test -f AllFabVideoLibrary.xcodeproj/project.pbxproj
          xcodebuild -project AllFabVideoLibrary.xcodeproj -list

      - name: Discover an available iPad simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          inventory="$RUNNER_TEMP/simulators.json"
          xcrun simctl list devices available --json > "$inventory"

          python3 - "$inventory" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          inventory_path, output_path = sys.argv[1:]
          with open(inventory_path, encoding="utf-8") as handle:
              inventory = json.load(handle)

          candidates = [
              device
              for devices in inventory.get("devices", {}).values()
              for device in devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPad")
          ]
          if not candidates:
              raise SystemExit("No available iPad simulator was found on the selected runner")

          selected = sorted(candidates, key=lambda item: (item["name"], item["udid"]))[0]
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"id={selected['udid']}\n")
              output.write(f"name={selected['name']}\n")
          print(f"Selected {selected['name']} ({selected['udid']})")
          PY

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ios
          simulator_id="${{ steps.simulator.outputs.id }}"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b

          set -o pipefail
          xcodebuild \
            -project ios/AllFabVideoLibrary.xcodeproj \
            -scheme AllFabVideoLibrary \
            -destination "platform=iOS Simulator,id=${simulator_id}" \
            -derivedDataPath build/ios/DerivedData \
            -resultBundlePath build/ios/AllFabVideoLibrary.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test | tee build/ios/xcodebuild.log

      - name: Upload Xcode evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ios-ci-${{ github.run_id }}
          path: |
            build/ios/AllFabVideoLibrary.xcresult
            build/ios/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
